# dsh-live-mcp bundle patch: inserts the dual-face plugin row
# into the web profile roster. Applied as a profile bundle layer (the
# `dsh.bundle.patch` manifest field) over dsh-base.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (skills filesystem engine, MCP connection manager via
# @deepseek-ai/dsh-mcp-client, /api/dsh-skills-mcp routes), and the
# `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/<id>/client.js) load in the web GUI.
#
# `id` is the row the user's own ~/.dsh/cordis.patch.yml toggles (keep it
# stable); `name` is the published package name and must match package.json.
- insert:
    - id: ui-skills-mcp-manager
      name: '@bingaha/dsh-live-mcp'